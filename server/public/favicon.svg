<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Modern Corporate / Startup Emblem -->
  <g filter="url(#glow)">
    <!-- Main central tower -->
    <path d="M26 14C26 12.8954 26.8954 12 28 12H36C37.1046 12 38 12.8954 38 14V50H26V14Z" fill="#ffffff" />
    
    <!-- Left building wing -->
    <path d="M15 24C15 22.8954 15.8954 22 17 22H24C25.1046 22 26 22.8954 26 24V50H15V24Z" fill="#e0e7ff" />
    
    <!-- Right building wing -->
    <path d="M38 28C38 26.8954 38.8954 26 40 26H47C48.1046 26 49 26.8954 49 28V50H38V28Z" fill="#cbd5e1" />

    <!-- Modern Windows Accent Dots -->
    <circle cx="32" cy="18" r="1.5" fill="#4f46e5" />
    <circle cx="32" cy="24" r="1.5" fill="#4f46e5" />
    <circle cx="32" cy="30" r="1.5" fill="#4f46e5" />
    <circle cx="32" cy="36" r="1.5" fill="#4f46e5" />
    
    <circle cx="20.5" cy="28" r="1.25" fill="#6366f1" />
    <circle cx="20.5" cy="34" r="1.25" fill="#6366f1" />

    <circle cx="43.5" cy="32" r="1.25" fill="#64748b" />
    <circle cx="43.5" cy="38" r="1.25" fill="#64748b" />

    <!-- Base foundation -->
    <rect x="12" y="49" width="40" height="3" rx="1.5" fill="#ffffff" />
  </g>
</svg>
