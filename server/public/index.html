<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indian Corporate Registry Explorer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Light Mode Status Badges */
    .badge-CONFIRMED { background-color: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .badge-LIKELY { background-color: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
    .badge-UNCERTAIN { background-color: #faf5ff; color: #7e22ce; border: 1px solid #e9d5ff; }
    .badge-NEEDS_MANUAL_CHECK { background-color: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .badge-NOT_FOUND { background-color: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; }

    /* Dark Mode Status Badges */
    .dark .badge-CONFIRMED { background-color: rgba(6, 78, 59, 0.45); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .dark .badge-LIKELY { background-color: rgba(12, 74, 110, 0.45); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4); }
    .dark .badge-UNCERTAIN { background-color: rgba(88, 28, 135, 0.45); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .dark .badge-NEEDS_MANUAL_CHECK { background-color: rgba(120, 53, 15, 0.45); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .dark .badge-NOT_FOUND { background-color: rgba(30, 41, 59, 0.7); color: #94a3b8; border: 1px solid rgba(71, 85, 105, 0.5); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Header / Navigation -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 shadow-sm transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-md shadow-indigo-100 dark:shadow-none">
          <i data-lucide="building-2" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">Company Registry Dashboard</h1>
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/70 dark:text-emerald-300 border border-transparent dark:border-emerald-800/50">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
              SQLite Live
            </span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400">Activity Code 62 · MCA Registered IT Companies</p>
        </div>
      </div>
      
      <!-- Top Right Controls (Dark Mode Toggle + Re-sync Excel) -->
      <div class="flex items-center gap-2.5">
        <!-- Dark Mode Toggle Button -->
        <button 
          id="themeToggleBtn" 
          type="button"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors border border-transparent dark:border-slate-700 cursor-pointer shadow-2xs"
          title="Toggle dark/light mode"
        >
          <i id="themeIcon" data-lucide="moon" class="w-3.5 h-3.5 text-indigo-500 dark:text-amber-400"></i>
          <span id="themeLabel">Dark Mode</span>
        </button>

        <!-- Re-sync Excel Button -->
        <button 
          id="resyncBtn" 
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors border border-transparent dark:border-slate-700"
        >
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          Re-sync Excel
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- 1. Top Metrics Cards -->
    <section>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5" id="metricsContainer">
        <!-- Rendered dynamically -->
        <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 h-24"></div>
        <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 h-24"></div>
        <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 h-24"></div>
        <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 h-24"></div>
        <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 h-24"></div>
        <div class="animate-pulse bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 h-24"></div>
      </div>
    </section>

    <!-- 2. Search, Filter & Controls Bar -->
    <section class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3.5 transition-colors">
      <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
        
        <!-- Search Input -->
        <div class="relative flex-1 max-w-lg">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 dark:text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search company name, CIN, or notes..." 
            class="w-full pl-9 pr-8 py-2 text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-800 transition-all"
          />
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Filter Controls -->
        <div class="flex flex-wrap items-center gap-2">
          <!-- Status Select -->
          <div class="relative">
            <select id="statusSelect" class="text-xs font-medium bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 pr-8 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
              <option value="ALL">All Statuses</option>
              <option value="CONFIRMED">CONFIRMED</option>
              <option value="LIKELY">LIKELY</option>
              <option value="NEEDS_MANUAL_CHECK">NEEDS MANUAL CHECK</option>
              <option value="UNCERTAIN">UNCERTAIN</option>
              <option value="NOT_FOUND">NOT FOUND</option>
            </select>
          </div>

          <!-- Website Exists Filter -->
          <div class="relative">
            <select id="hasWebsiteSelect" class="text-xs font-medium bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 pr-8 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
              <option value="">Any Website</option>
              <option value="true">Has Website</option>
              <option value="false">No Website</option>
            </select>
          </div>

          <!-- Sort Filter -->
          <div class="relative">
            <select id="sortSelect" class="text-xs font-medium bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 pr-8 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
              <option value="company_name:asc">Name (A-Z)</option>
              <option value="company_name:desc">Name (Z-A)</option>
              <option value="date_of_registration:desc">Newest Reg. Date</option>
              <option value="date_of_registration:asc">Oldest Reg. Date</option>
              <option value="status:asc">Status</option>
            </select>
          </div>

          <!-- Page size -->
          <div class="relative">
            <select id="limitSelect" class="text-xs font-medium bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
              <option value="10">10 / page</option>
              <option value="20" selected>20 / page</option>
              <option value="50">50 / page</option>
              <option value="100">100 / page</option>
            </select>
          </div>

          <!-- Reset Filter -->
          <button id="resetFiltersBtn" title="Reset Filters" class="p-2 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- 3. Companies Data Table -->
    <section class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden transition-colors">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50/80 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider">
              <th class="py-3.5 px-4 w-44">CIN</th>
              <th class="py-3.5 px-4 min-w-[200px]">Company Name</th>
              <th class="py-3.5 px-4 w-32">Reg. Date</th>
              <th class="py-3.5 px-4 min-w-[160px]">Website URL</th>
              <th class="py-3.5 px-4 w-40">Status</th>
              <th class="py-3.5 px-4 min-w-[260px]">Notes / Evidence</th>
              <th class="py-3.5 px-4 w-20 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 dark:divide-slate-800/80 text-sm">
            <!-- Dynamically populated rows -->
            <tr>
              <td colspan="7" class="py-12 text-center text-slate-400 dark:text-slate-500">Loading companies...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Footer -->
      <div class="px-4 py-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4 transition-colors">
        <div class="text-xs text-slate-500 dark:text-slate-400" id="paginationInfo">
          Showing <span class="font-semibold text-slate-700 dark:text-slate-200">0</span> to <span class="font-semibold text-slate-700 dark:text-slate-200">0</span> of <span class="font-semibold text-slate-700 dark:text-slate-200">0</span> companies
        </div>
        <div class="flex items-center space-x-1" id="paginationControls">
          <!-- Dynamically populated buttons -->
        </div>
      </div>
    </section>

  </main>

  <!-- Edit Company Modal -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4 animate-in fade-in duration-200 transition-colors">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <div>
          <h3 class="text-base font-bold text-slate-900 dark:text-white">Edit Company Record</h3>
          <p id="modalCinDisplay" class="mono text-xs text-slate-500 dark:text-slate-400"></p>
        </div>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="editForm" class="space-y-4">
        <input type="hidden" id="modalCinInput" />
        
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase mb-1">Company Name</label>
          <input type="text" id="modalNameInput" readonly class="w-full px-3 py-2 text-sm bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-500 dark:text-slate-400 cursor-not-allowed" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase mb-1">Status</label>
          <select id="modalStatusInput" class="w-full px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="CONFIRMED">CONFIRMED</option>
            <option value="LIKELY">LIKELY</option>
            <option value="NEEDS_MANUAL_CHECK">NEEDS_MANUAL_CHECK</option>
            <option value="UNCERTAIN">UNCERTAIN</option>
            <option value="NOT_FOUND">NOT_FOUND</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase mb-1">Website URL</label>
          <input type="url" id="modalWebsiteInput" placeholder="https://example.com" class="w-full px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase mb-1">Notes / Evidence</label>
          <textarea id="modalNotesInput" rows="3" placeholder="Add verification findings or notes..." class="w-full px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" id="cancelModalBtn" class="px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg transition-colors">
            Cancel
          </button>
          <button type="submit" id="saveModalBtn" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors">
            <i data-lucide="check" class="w-4 h-4"></i>
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 dark:bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg border border-transparent dark:border-slate-700 flex items-center gap-2 text-xs font-medium">
      <i id="toastIcon" data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
      <span id="toastMsg">Changes saved</span>
    </div>
  </div>

  <!-- Dashboard Client Logic -->
  <script>
    // State management
    const state = {
      page: 1,
      limit: 20,
      search: '',
      status: 'ALL',
      hasWebsite: '',
      sortBy: 'company_name',
      order: 'asc',
      metrics: null
    };

    let searchTimeout = null;

    // Dark Mode Initialization & Toggle
    function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved === 'dark' || (!saved && prefersDark);
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      const html = document.documentElement;
      const themeLabel = document.getElementById('themeLabel');
      const themeIcon = document.getElementById('themeIcon');

      if (isDark) {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        themeLabel.innerText = 'Light Mode';
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        themeLabel.innerText = 'Dark Mode';
        themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(!isDark);
    });

    // Fetch and render metrics
    async function loadMetrics() {
      try {
        const res = await fetch('/api/metrics');
        const json = await res.json();
        if (json.success) {
          state.metrics = json.metrics;
          renderMetrics(json.metrics);
        }
      } catch (e) {
        console.error('Failed to load metrics:', e);
      }
    }

    function renderMetrics(m) {
      const container = document.getElementById('metricsContainer');
      const cards = [
        { label: 'Total Companies', count: m.total, icon: 'database', bg: 'text-indigo-600 dark:text-indigo-400', filter: 'ALL' },
        { label: 'Confirmed', count: m.statusCounts.CONFIRMED, icon: 'check-circle-2', bg: 'text-emerald-600 dark:text-emerald-400', filter: 'CONFIRMED' },
        { label: 'Likely', count: m.statusCounts.LIKELY, icon: 'thumbs-up', bg: 'text-sky-600 dark:text-sky-400', filter: 'LIKELY' },
        { label: 'Needs Check', count: m.statusCounts.NEEDS_MANUAL_CHECK, icon: 'alert-triangle', bg: 'text-amber-600 dark:text-amber-400', filter: 'NEEDS_MANUAL_CHECK' },
        { label: 'Uncertain', count: m.statusCounts.UNCERTAIN, icon: 'help-circle', bg: 'text-purple-600 dark:text-purple-400', filter: 'UNCERTAIN' },
        { label: 'Not Found', count: m.statusCounts.NOT_FOUND, icon: 'x-circle', bg: 'text-slate-500 dark:text-slate-400', filter: 'NOT_FOUND' },
      ];

      container.innerHTML = cards.map(c => `
        <div 
          onclick="selectStatusFilter('${c.filter}')"
          class="bg-white dark:bg-slate-900 p-3.5 rounded-xl border ${state.status === c.filter ? 'ring-2 ring-indigo-500 border-transparent shadow-sm' : 'border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700'} transition-all cursor-pointer shadow-2xs group"
        >
          <div class="flex items-center justify-between text-slate-400 dark:text-slate-500 group-hover:text-slate-600 dark:group-hover:text-slate-300 mb-1">
            <span class="text-[11px] font-medium tracking-tight text-slate-500 dark:text-slate-400">${c.label}</span>
            <i data-lucide="${c.icon}" class="w-4 h-4 ${c.bg}"></i>
          </div>
          <div class="text-xl font-bold text-slate-900 dark:text-white">${c.count.toLocaleString()}</div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // Fetch and render company rows
    async function loadCompanies() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="py-12 text-center text-slate-400 dark:text-slate-500">Loading companies...</td></tr>`;

      try {
        const query = new URLSearchParams({
          page: state.page,
          limit: state.limit,
          search: state.search,
          status: state.status,
          hasWebsite: state.hasWebsite,
          sortBy: state.sortBy,
          order: state.order
        });

        const res = await fetch(`/api/companies?${query}`);
        const json = await res.json();

        if (json.success) {
          renderTable(json.data, json.pagination);
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-rose-500">Error: ${json.error}</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-rose-500">Failed to load data. Is server running?</td></tr>`;
      }
    }

    function renderTable(companies, pagination) {
      const tbody = document.getElementById('tableBody');

      if (companies.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-16 text-center text-slate-400 dark:text-slate-500">
              <i data-lucide="folder-search" class="w-8 h-8 mx-auto mb-2 text-slate-300 dark:text-slate-600"></i>
              No companies match your filters.
            </td>
          </tr>
        `;
        lucide.createIcons();
        updatePagination(pagination);
        return;
      }

      tbody.innerHTML = companies.map(c => {
        const statusBadgeClass = `badge-${c.status}`;
        const hasUrl = c.website_url && c.website_url.trim().length > 0;
        const notes = c.notes_evidence || '—';

        return `
          <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/60 transition-colors group">
            <td class="py-3 px-4 font-mono text-xs text-slate-600 dark:text-slate-400 select-all">${c.cin}</td>
            <td class="py-3 px-4 font-semibold text-slate-800 dark:text-slate-100">${escapeHtml(c.company_name)}</td>
            <td class="py-3 px-4 text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap">${c.date_of_registration || '—'}</td>
            <td class="py-3 px-4 text-xs">
              ${hasUrl ? `
                <a href="${escapeHtml(c.website_url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-medium hover:underline max-w-[200px] truncate" title="${escapeHtml(c.website_url)}">
                  <span>${escapeHtml(c.website_url.replace(/^https?:\/\/(www\.)?/, ''))}</span>
                  <i data-lucide="external-link" class="w-3 h-3 shrink-0"></i>
                </a>
              ` : `<span class="text-slate-400 dark:text-slate-500 italic">No URL</span>`}
            </td>
            <td class="py-3 px-4">
              <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold ${statusBadgeClass}">
                ${c.status.replace(/_/g, ' ')}
              </span>
            </td>
            <td class="py-3 px-4 text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
              <div class="line-clamp-2" title="${escapeHtml(notes)}">
                ${escapeHtml(notes)}
              </div>
            </td>
            <td class="py-3 px-4 text-center">
              <button 
                onclick='openEditModal(${JSON.stringify(c).replace(/'/g, "&apos;")})'
                class="p-1.5 text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-md transition-colors"
                title="Edit Company"
              >
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
      updatePagination(pagination);
    }

    function updatePagination(p) {
      const start = p.totalRecords === 0 ? 0 : (p.page - 1) * p.limit + 1;
      const end = Math.min(p.page * p.limit, p.totalRecords);

      document.getElementById('paginationInfo').innerHTML = `
        Showing <span class="font-semibold text-slate-700 dark:text-slate-200">${start.toLocaleString()}</span> to 
        <span class="font-semibold text-slate-700 dark:text-slate-200">${end.toLocaleString()}</span> of 
        <span class="font-semibold text-slate-700 dark:text-slate-200">${p.totalRecords.toLocaleString()}</span> companies
      `;

      const controls = document.getElementById('paginationControls');
      let buttonsHtml = '';

      // Prev Button
      buttonsHtml += `
        <button 
          onclick="changePage(${p.page - 1})"
          ${p.page <= 1 ? 'disabled class="opacity-40 cursor-not-allowed"' : 'class="hover:bg-slate-100 dark:hover:bg-slate-800"'}
          class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs transition-colors"
        >
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
      `;

      // Page numbers (window around current page)
      const maxButtons = 5;
      let startPage = Math.max(1, p.page - 2);
      let endPage = Math.min(p.totalPages, startPage + maxButtons - 1);
      if (endPage - startPage < maxButtons - 1) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }

      if (startPage > 1) {
        buttonsHtml += `<button onclick="changePage(1)" class="px-2.5 py-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">1</button>`;
        if (startPage > 2) buttonsHtml += `<span class="px-1 text-slate-400 dark:text-slate-500 text-xs">...</span>`;
      }

      for (let i = startPage; i <= endPage; i++) {
        const isActive = i === p.page;
        buttonsHtml += `
          <button 
            onclick="changePage(${i})" 
            class="px-2.5 py-1 text-xs rounded-lg border ${isActive ? 'bg-indigo-600 text-white border-indigo-600 font-bold' : 'border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200'}"
          >${i}</button>
        `;
      }

      if (endPage < p.totalPages) {
        if (endPage < p.totalPages - 1) buttonsHtml += `<span class="px-1 text-slate-400 dark:text-slate-500 text-xs">...</span>`;
        buttonsHtml += `<button onclick="changePage(${p.totalPages})" class="px-2.5 py-1 text-xs rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">${p.totalPages}</button>`;
      }

      // Next Button
      buttonsHtml += `
        <button 
          onclick="changePage(${p.page + 1})"
          ${p.page >= p.totalPages ? 'disabled class="opacity-40 cursor-not-allowed"' : 'class="hover:bg-slate-100 dark:hover:bg-slate-800"'}
          class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs transition-colors"
        >
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      `;

      controls.innerHTML = buttonsHtml;
      lucide.createIcons();
    }

    function changePage(newPage) {
      if (newPage < 1) return;
      state.page = newPage;
      loadCompanies();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectStatusFilter(status) {
      state.status = status;
      state.page = 1;
      document.getElementById('statusSelect').value = status;
      if (state.metrics) renderMetrics(state.metrics);
      loadCompanies();
    }

    // Modal Operations
    window.openEditModal = function(company) {
      document.getElementById('modalCinDisplay').innerText = `CIN: ${company.cin}`;
      document.getElementById('modalCinInput').value = company.cin;
      document.getElementById('modalNameInput').value = company.company_name;
      document.getElementById('modalStatusInput').value = company.status;
      document.getElementById('modalWebsiteInput').value = company.website_url || '';
      document.getElementById('modalNotesInput').value = company.notes_evidence || '';
      document.getElementById('editModal').classList.remove('hidden');
    };

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    document.getElementById('closeModalBtn').addEventListener('click', closeEditModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeEditModal);

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const cin = document.getElementById('modalCinInput').value;
      const status = document.getElementById('modalStatusInput').value;
      const website_url = document.getElementById('modalWebsiteInput').value.trim();
      const notes_evidence = document.getElementById('modalNotesInput').value.trim();

      try {
        const res = await fetch(`/api/companies/${cin}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, website_url, notes_evidence })
        });
        const json = await res.json();
        if (json.success) {
          closeEditModal();
          showToast('Company details updated successfully!');
          loadCompanies();
          loadMetrics();
        } else {
          alert('Failed to update: ' + json.error);
        }
      } catch (err) {
        alert('Error updating company.');
      }
    });

    // Toast message
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Event Listeners for Filters
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const val = e.target.value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', val.length === 0);
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        state.search = val;
        state.page = 1;
        loadCompanies();
      }, 300);
    });

    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      state.search = '';
      state.page = 1;
      loadCompanies();
    });

    document.getElementById('statusSelect').addEventListener('change', (e) => {
      selectStatusFilter(e.target.value);
    });

    document.getElementById('hasWebsiteSelect').addEventListener('change', (e) => {
      state.hasWebsite = e.target.value;
      state.page = 1;
      loadCompanies();
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      const [col, ord] = e.target.value.split(':');
      state.sortBy = col;
      state.order = ord;
      loadCompanies();
    });

    document.getElementById('limitSelect').addEventListener('change', (e) => {
      state.limit = parseInt(e.target.value);
      state.page = 1;
      loadCompanies();
    });

    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      state.page = 1;
      state.search = '';
      state.status = 'ALL';
      state.hasWebsite = '';
      state.sortBy = 'company_name';
      state.order = 'asc';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('statusSelect').value = 'ALL';
      document.getElementById('hasWebsiteSelect').value = '';
      document.getElementById('sortSelect').value = 'company_name:asc';
      document.getElementById('limitSelect').value = '20';
      if (state.metrics) renderMetrics(state.metrics);
      loadCompanies();
    });

    document.getElementById('resyncBtn').addEventListener('click', async () => {
      const btn = document.getElementById('resyncBtn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Ingesting...`;
      lucide.createIcons();

      try {
        const res = await fetch('/api/import', { method: 'POST' });
        const json = await res.json();
        if (json.success) {
          showToast(`Ingested ${json.count} companies from Excel!`);
          loadMetrics();
          loadCompanies();
        } else {
          alert('Sync error: ' + json.error);
        }
      } catch (e) {
        alert('Failed to trigger sync');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Re-sync Excel`;
        lucide.createIcons();
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initialize Theme and load data
    initTheme();
    loadMetrics();
    loadCompanies();
  </script>
</body>
</html>
